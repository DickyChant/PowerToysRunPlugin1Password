name: Build Plugin

on:
  push:
    branches:
      - fix-logger
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore 1PasswordPlugin.sln

    - name: Build plugin
      run: dotnet build 1PasswordPlugin.sln -c Release --no-restore

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 1Password-Plugin-v0.97.2.0
        path: bin\Release\net9.0-windows\
