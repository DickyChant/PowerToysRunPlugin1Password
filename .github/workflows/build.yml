name: Build Plugin

on:
  push:
    branches:
      - fix-logger
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Download and extract PowerToys dependencies
      run: |
        Invoke-WebRequest -Uri "https://github.com/microsoft/PowerToys/releases/download/v0.80.1/PowerToysSetup-0.80.1-x64.exe" -OutFile "PowerToys.exe"
        7z x PowerToys.exe -o"ExtractedPowerToys"
        mkdir Lib
        Copy-Item -Path "ExtractedPowerToys\WinUI3Apps\PowerToys.Common.UI.dll" -Destination "Lib\" -ErrorAction SilentlyContinue
        Copy-Item -Path "ExtractedPowerToys\WinUI3Apps\PowerToys.ManagedCommon.dll" -Destination "Lib\" -ErrorAction SilentlyContinue
        Copy-Item -Path "ExtractedPowerToys\WinUI3Apps\PowerToys.Settings.UI.Lib.dll" -Destination "Lib\" -ErrorAction SilentlyContinue
        Copy-Item -Path "ExtractedPowerToys\WinUI3Apps\Wox.Infrastructure.dll" -Destination "Lib\" -ErrorAction SilentlyContinue
        Copy-Item -Path "ExtractedPowerToys\WinUI3Apps\Wox.Plugin.dll" -Destination "Lib\" -ErrorAction SilentlyContinue

    - name: Restore dependencies
      run: dotnet restore 1PasswordPlugin.sln

    - name: Build plugin
      run: dotnet build 1PasswordPlugin.sln -c Release --no-restore

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 1Password-Plugin-v0.97.2.0
        path: bin\Release\net8.0-windows\
