name: Build Plugin

on:
  push:
    branches:
      - fix-logger
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Get PowerToys MSBuild References
      run: |
        mkdir Lib
        Invoke-WebRequest -Uri "https://github.com/microsoft/PowerToys/raw/v0.80.1/src/modules/launcher/Wox.Plugin/bin/Release/net8.0-windows/PowerToys.Common.UI.dll" -OutFile "Lib\PowerToys.Common.UI.dll" -ErrorAction SilentlyContinue 
        Invoke-WebRequest -Uri "https://github.com/microsoft/PowerToys/raw/v0.80.1/src/modules/launcher/Wox.Plugin/bin/Release/net8.0-windows/PowerToys.ManagedCommon.dll" -OutFile "Lib\PowerToys.ManagedCommon.dll" -ErrorAction SilentlyContinue
        Invoke-WebRequest -Uri "https://github.com/microsoft/PowerToys/raw/v0.80.1/src/modules/launcher/Wox.Plugin/bin/Release/net8.0-windows/PowerToys.Settings.UI.Lib.dll" -OutFile "Lib\PowerToys.Settings.UI.Lib.dll" -ErrorAction SilentlyContinue
        Invoke-WebRequest -Uri "https://github.com/microsoft/PowerToys/raw/v0.80.1/src/modules/launcher/Wox.Plugin/bin/Release/net8.0-windows/Wox.Infrastructure.dll" -OutFile "Lib\Wox.Infrastructure.dll" -ErrorAction SilentlyContinue
        Invoke-WebRequest -Uri "https://github.com/microsoft/PowerToys/raw/v0.80.1/src/modules/launcher/Wox.Plugin/bin/Release/net8.0-windows/Wox.Plugin.dll" -OutFile "Lib\Wox.Plugin.dll" -ErrorAction SilentlyContinue

    - name: Restore dependencies
      run: dotnet restore 1PasswordPlugin.sln

    - name: Build plugin
      run: dotnet build 1PasswordPlugin.sln -c Release --no-restore

    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 1Password-Plugin-v0.97.2.0
        path: bin\Release\net8.0-windows\
