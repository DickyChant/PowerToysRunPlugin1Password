name: Build and Release Plugin

on:
  push:
    branches:
      - fix-logger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore 1PasswordPlugin.sln

    - name: Build plugin
      run: dotnet build 1PasswordPlugin.sln -c Release --no-restore

    - name: Package release
      run: |
        $outDir = Get-ChildItem -Path bin -Recurse -Filter "Community.PowerToys.Run.Plugin._1Password.dll" | Select-Object -First 1 -ExpandProperty DirectoryName
        Write-Host "Found output at: $outDir"
        Compress-Archive -Path "$outDir\*" -DestinationPath "_1Password-v1.6.0-x64-fix.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.6.0-fix
        name: "1Password Plugin v1.6.0 (PowerToys v0.97.2 fix)"
        body: |
          Fixed MissingMethodException for PowerToys v0.97.2.0.
          Migrated from ManagedCommon.Logger to Wox.Plugin.Logger.
        files: _1Password-v1.6.0-x64-fix.zip
